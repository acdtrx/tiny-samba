name: release

on:
  push:
    branches: [main]
    tags: ['v*']

# GITHUB_TOKEN needs `packages: write` to push to ghcr.io. `contents: read`
# is the default for the checkout step. Anything not listed here is denied.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile injects `main.version` from a VERSION file in the build
      # context. On a tag build we use the tag (`v1.2.3`); on main we use a
      # short-sha-prefixed `edge-abc1234` so binaries are still traceable.
      - name: Stamp VERSION from ref
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "${GITHUB_REF#refs/tags/}" > VERSION
          else
            echo "edge-${GITHUB_SHA::7}" > VERSION
          fi
          echo "VERSION file contains: $(cat VERSION)"

      # QEMU lets the amd64 GitHub runner emulate arm64 so we can produce a
      # multi-arch manifest in one job. buildx is the BuildKit-based builder
      # that knows how to drive that.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # `github.actor` is whoever pushed; the token is scoped to this repo and
      # auto-issued by Actions. No PAT to manage.
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Computes the full set of image tags from the git ref, plus standard
      # OCI labels (source, revision, created date) baked into the manifest.
      #
      #   push to main         -> :edge
      #   push tag v1.2.3      -> :1.2.3, :1.2, :latest
      #   push tag v1.2.3-rc1  -> :1.2.3-rc1, :1.2  (no :latest for pre-releases)
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tiny-samba
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
