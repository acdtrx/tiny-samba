name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: go test + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: tidy
        run: go mod tidy

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

  image:
    name: docker build (Dockerfile sanity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: tiny-samba:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
