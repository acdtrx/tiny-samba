[global]
    workgroup = WORKGROUP
    netbios name = tiny-samba
    server string = tiny-samba
    server min protocol = SMB3
    security = user
    passdb backend = tdbsam
    map to guest = Bad User
    log file = /dev/stderr
    log level = 1 quota:0 vfs:0
    max log size = 0
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    show add printer wizard = no
    dns proxy = no
    disable netbios = yes
    usershare max shares = 0
    name resolve order = host
    host msdfs = no
    idmap config * : backend = tdb
    idmap config * : range = 100000-200000
    vfs objects = catia fruit streams_xattr
    fruit:metadata = stream
    fruit:model = TimeCapsule6,106
    fruit:posix_rename = yes
    fruit:veto_appledouble = no
    fruit:nfs_aces = no
    fruit:wipe_intentionally_left_blank_rfork = yes
    fruit:delete_empty_adouble = yes
    spotlight = no

[documents]
    path = /data/documents
    comment = Shared documents
    browseable = yes
    force user = smbuser
    force group = smbgroup
    create mask = 0660
    directory mask = 0770
    valid users = alice, bob
    read only = yes
    write list = alice

[media]
    path = /data/media
    browseable = yes
    force user = smbuser
    force group = smbgroup
    create mask = 0660
    directory mask = 0770
    valid users = alice, carol
    read only = yes
    write list = carol

[public]
    path = /data/public
    comment = Public read-only
    browseable = yes
    force user = smbuser
    force group = smbgroup
    create mask = 0660
    directory mask = 0770
    guest ok = yes
    guest only = yes
    read only = yes
